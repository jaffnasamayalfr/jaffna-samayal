<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #0078ff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #005fcc;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
        }

        .hero h2 {
            margin-bottom: 15px;
            color: #0078ff;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #0078ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #005fcc;
        }

        footer {
            margin-top: 40px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenue sur Mon Site</h1>
        <p>Page d'accueil HTML complète</p>
    </header>

    <nav>
        <a href="#">Accueil</a>
        <a href="#">Services</a>
        <a href="#">À propos</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <section class="hero">
            <h2>Créez votre projet web</h2>
            <p>
                Cette page HTML est prête à être utilisée et personnalisée.
            </p>
            <a href="#" class="btn">Commencer</a>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Mon Site Web - Tous droits réservés.</p>
    </footer>

    <script>
        console.log("Site chargé avec succès !");
    </script>

</body>
</html>
